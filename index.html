<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบขออัตรากำลัง</title>
    <!-- เชื่อมโยง Manifest เพื่อสร้างไอคอนลง Desktop -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="AEKMJ.png">
    <meta name="theme-color" content="#1565C0">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- ดึงเว็บแอป Google Apps Script มาแสดงแบบเต็มจอ -->
    <!-- อนุญาตให้เปิด Popup ดูไฟล์ PDF/ใบลาออกได้ตามปกติ -->
    <iframe src="https://script.google.com/a/macros/aek.co.th/s/AKfycbxlZtNRNumltyW55yTrzyWYVUxLupyXoYXle2pco8HppxF2JiBwDeJ5c771Cv-qNWgu/exec" 
            allow="fullscreen" 
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox">
    </iframe>

    <script>
        // จดทะเบียน Service Worker เพื่อบังคับให้เบราว์เซอร์แสดงปุ่ม "ติดตั้งแอป"
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Reg Failed:', err));
            });
        }
    </script>
</body>
</html>
